[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onyx-git-ingest"
version = "0.1.0"
description = "Ingest markdown files from a git repo URL or local directory into Onyx via the Ingestion API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joakim Nohlgård", email = "joakim@nohlgard.se" }]
keywords = ["onyx", "danswer", "ingestion", "markdown", "git"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
# Runtime dependencies (see docs/PLAN.md):
dependencies = [
    "requests>=2.31",       # HTTP client for the Onyx Ingestion API
    "python-dotenv>=1.0",   # .env loading
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",          # HTTP mocking for the Onyx client tests
]

[project.scripts]
onyx-git-ingest = "onyx_git_ingest.cli:main"

[project.urls]
Documentation = "https://docs.onyx.app/developers/guides/index_files_ingestion_api"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
